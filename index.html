<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeeCX — 3D Voxel World & Central Complex Navigation</title>
    <meta name="description" content="High-fidelity 3D voxel world simulation of a honeybee foraging with biological Central Complex path integration." />
    <link rel="stylesheet" href="styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main id="gameShell">
      <!-- 3D WebGL Canvas -->
      <canvas id="world" aria-label="A live 3D voxel world simulating a bee in a riverside meadow"></canvas>

      <!-- Compound Eye Hexagonal POV Filter -->
      <div id="povOverlay" aria-hidden="true"></div>

      <!-- Top-Left Branding & Environment Telemetry -->
      <header class="hud top-left-hud">
        <div class="brand-badge">
          <span class="logo-pill">BEE-CX v2</span>
          <div class="environment-tag">
            <span><i class="indicator-active"></i> 3D VOXEL BIOME</span>
            <span id="biomeCoords">X: 0 | Z: 0</span>
          </div>
        </div>
        <h1>Riverside Meadow</h1>
      </header>

      <!-- Top-Right Camera Modes & Lighting Selector -->
      <div class="hud top-right-hud">
        <div class="cam-btn-group" role="group" aria-label="Camera Perspectives">
          <button id="camChase" class="cam-btn active" title="Third-person chase camera">
            <span>🎥 Chase</span>
          </button>
          <button id="camPov" class="cam-btn" title="Bee compound eye first-person view">
            <span>🐝 Bee POV</span>
          </button>
          <button id="camOrbit" class="cam-btn" title="Free orbit god camera">
            <span>🌐 Orbit</span>
          </button>
        </div>
        <button id="timeBtn" class="btn-glass" title="Toggle Golden Hour / Daylight / Dusk">
          <span id="timeIcon">☀️</span> <span id="timeLabel">Noon</span>
        </button>
      </div>

      <!-- Bee Internal State & Telemetry -->
      <aside class="hud brain-hud" aria-live="polite">
        <div class="panel-header">
          <span class="panel-title">Bee Telemetry</span>
          <span id="modeBadge" class="status-badge exploring">EXPLORING</span>
        </div>
        <dl class="telemetry-list">
          <div class="telemetry-row">
            <dt>Home Vector</dt>
            <dd id="homeReadout">0.0 m</dd>
          </div>
          <div class="telemetry-row">
            <dt>Flight Target</dt>
            <dd id="targetReadout">Scanning meadow</dd>
          </div>
          <div class="telemetry-row">
            <dt>Altitude</dt>
            <dd id="altReadout">2.4 m</dd>
          </div>
          <div class="telemetry-row">
            <dt>Velocity</dt>
            <dd id="speedStatReadout">5.1 m/s</dd>
          </div>
        </dl>
        <div class="nectar-meter-wrap">
          <div class="meter-label">
            <span>Nectar Payload</span>
            <span id="nectarText">0 / 3</span>
          </div>
          <div class="meter-track">
            <div id="nectarBar" class="meter-fill"></div>
          </div>
        </div>
      </aside>

      <!-- Center-Bottom Objective Toast -->
      <div class="hud objective-toast" id="objective" role="status">
        <i>✦</i> <span id="objectiveText">Bee waking up in the hive meadow…</span>
      </div>

      <!-- Bottom Interactive Control Toolbar -->
      <footer class="hud bottom-toolbar">
        <div class="controls-left">
          <button id="toggleButton" class="btn-glass">
            <span id="playIcon">⏸</span> Pause
          </button>
          <button id="resetButton" class="btn-glass">
            <span>↺</span> Reset Flight
          </button>
          <button id="plantBtn" class="btn-glass btn-highlight">
            <span>🌸</span> Plant Flower
          </button>
        </div>

        <div class="controls-center">
          <div class="speed-control">
            <span>Speed</span>
            <input id="speedRange" type="range" min="0.5" max="3" step="0.5" value="1" aria-label="Simulation speed multiplier" />
            <output id="speedOutput">1.0×</output>
          </div>
          <div class="click-hint">
            <kbd>Click Ground</kbd> to plant flower
          </div>
        </div>

        <div class="controls-right">
          <div class="stats-counter" id="statsReadout">
            <span>Visited: <strong id="visitedCount">0</strong></span>
            <span>Delivered: <strong id="deliveredCount">0</strong></span>
          </div>
        </div>
      </footer>
    </main>

    <!-- Main 3D Simulation Engine -->
    <script type="module" src="app.js"></script>
  </body>
</html>
